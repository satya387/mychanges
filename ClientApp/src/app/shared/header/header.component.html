 <div class="modal fade Cocpage" id="cocModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered modal-xl coc-modal" style="position: relative;">
        <div class="modal-content">

            <div class="modal-header">
                <div>
                    <h4 class="modal-title">
                        Code of Conduct
                    </h4>
                </div>
            </div>

            <div class="modal-body">

                <div class="pdf-container" #pdfContainer></div>

            </div>

            <div class="modal-footer">

                <div class="form-check me-auto">
                    <input
                        class="form-check-input coc-checkbox"
                        type="checkbox"
                        id="acceptCoc"
                        [(ngModel)]="acceptCoc">

                    <label class="form-check-label" for="acceptCoc">
                        I confirm that I have read, understood, and agree to comply with the Code of Conduct and all related policy requirements.
                    </label>
                </div>

                <button
                    class="btn btn-success px-4"
                    (click)="submitCodeOfConduct()"
                    [disabled]="!acceptCoc">

                    Accept
                </button>

            </div>

        </div>
    </div>
