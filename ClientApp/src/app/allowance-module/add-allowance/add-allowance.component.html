<div class="container-fluid edit-rr-desktop1" style="margin-top:60px;margin-left: 18px;">
    <!-- <app-back-button [routerPath]="'/purchase-order'"></app-back-button> -->
  
    <div class="add-edit-role-wrap adding-margin-to-table" style="margin-top:-40px;">
      <span class="steps d-block d-md-none d-flex justify-content-end">Step 1/3</span>
      <div class="add-edit-head">
        <h1 style="margin-top:36px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-stack"
               viewBox="0 0 16 16">
            <path d="m14.12 10.163 1.715.858c.22.11.22.424 0 .534L8.267 15.34a.598.598 0 0 1-.534 0L.165 11.555a.299.299 0 0 1 0-.534l1.716-.858 5.317 2.659c.505.252 1.1.252 1.604 0l5.317-2.66zM7.733.063a.598.598 0 0 1 .534 0l7.568 3.784a.3.3 0 0 1 0 .535L8.267 8.165a.598.598 0 0 1-.534 0L.165 4.382a.299.299 0 0 1 0-.535L7.733.063z" />
            <path d="m14.12 6.576 1.715.858c.22.11.22.424 0 .534l-7.568 3.784a.598.598 0 0 1-.534 0L.165 7.968a.299.299 0 0 1 0-.534l1.716-.858 5.317 2.659c.505.252 1.1.252 1.604 0l5.317-2.659z" />
          </svg>
          {{resourceAction}} Allowance
        </h1>
  
      </div>
    </div>
    <div class="container-fluid edit-rr-desktop" style="margin-top: -22px;">
      <form [formGroup]="addAllowanceForm">
      <!-- PR Number Select (only shown once) -->
      <div  class="row role-input1" style="margin-left: 57px;">
        <!-- First row with four fields -->
        <div  class="my-2 col-lg-3 col-md-3 col-3 role-input">
          <label for="forRoleNameSection" class="form-label main-heading">Project</label><span> *</span>
          <select class="form-select project-detail" formControlName="ProjId" (change)="onProjectChange($event)">
            <option [ngValue]="null">Select</option>
            <!-- <option [value]="21648">ARC</option> -->
            <option *ngFor="let item of ProjectList" [value]="item.projectId">{{item.projectName}}</option>
          </select>
          <div class="validation-message-container">
            <span *ngIf="(addAllowanceForm.controls['ProjId'].invalid && (addAllowanceForm.controls['ProjId'].dirty || addAllowanceForm.controls['ProjId'].touched))">
              <span *ngIf="addAllowanceForm.controls['ProjId'].errors.required || !addAllowanceForm.controls['ProjId'].value" class="text-danger">
                Please Select Project
              </span>
            </span>
          </div>
        </div>
        <div  class="my-2 col-lg-3 col-md-3 col-3 role-input">
            <label for="forRoleNameSection" class="form-label main-heading">Employee</label><span> *</span>
            <select class="form-select employee-detail" formControlName="EmployeeId" (change)="onEmployeeChange($event)">
              <option [ngValue]="null">Select</option>
              <!-- <option value="INEMP5074">Birundha</option>
              <option value="INEMP5710">Siva Sankar Palraj</option> -->
              <option *ngFor="let item of ProjectWiseEmployeeList" [ngValue]="item.employeeId">{{ item.employeeName }} - {{ item.employeeId }}</option>
            </select>
            <div class="validation-message-container">
              <span *ngIf="(addAllowanceForm.controls['EmployeeId'].invalid && (addAllowanceForm.controls['EmployeeId'].dirty || addAllowanceForm.controls['EmployeeId'].touched))">
                <span *ngIf="addAllowanceForm.controls['EmployeeId'].errors.required || !addAllowanceForm.controls['EmployeeId'].value" class="text-danger">
                  Please Select Employee
                </span>
              </span>
            </div>
          </div>
          <div class="my-2 col-lg-3 col-md-3 col-3 role-input">
            <label for="forRoleNameSection" class="form-label main-heading">Designation</label>
            <input type="text" id="designation" name="designation" placeholder="Designation" class="project-detail1 no-field"
                   formControlName="EmpDesignation" style="padding:6px;" readonly [value]="this.EmpDesignation" />
          </div>
          <div class="my-2 col-lg-3 col-md-3 col-3 role-input">
            <label for="forRoleNameSection" class="form-label main-heading">Billability</label>
            <input type="text" id="billability" name="billability" placeholder="Billability" class="project-detail1 no-field"
                   formControlName="Billability" style="padding:6px;" readonly [value]="this.Billability" />
          </div>
       
      </div>

          </div>
        </div> -->

                            <div class="my-2 col-lg-2 col-md-3 col-3 role-input">
                                <label for="forRoleNameSection" class="form-label main-heading">Year</label><span> *</span>

                                  <!-- <option *ngFor="let item of filteredYearOptions" [value]="item.value">{{item.label}}</option> -->
                                  <option *ngFor="let item of filteredYearOptions | async" [ngValue]="item.value"> {{ item.label }} </option>
                                </select>
                                <div class="validation-message-container">
                                  <span *ngIf="(addAllowanceForm.controls['Year'].invalid && (addAllowanceForm.controls['Year'].dirty || addAllowanceForm.controls['Year'].touched))">
                                    <span *ngIf="addAllowanceForm.controls['Year'].errors.required || !addAllowanceForm.controls['Year'].value" class="text-danger">
                                      Please Select Year
                                    </span>
                                  </span>
                                </div>
                              </div>

                                <div class="validation-message-container">

                              <div  class="my-2 col-lg-2 col-md-3 col-3 role-input">

                                <div class="validation-message-container">
                                  <span *ngIf="(addAllowanceForm.controls['NoOfDays'].invalid && (addAllowanceForm.controls['NoOfDays'].dirty || addAllowanceForm.controls['NoOfDays'].touched))">
                                    <span *ngIf="addAllowanceForm.controls['NoOfDays'].errors.required || !addAllowanceForm.controls['NoOfDays'].value" class="text-danger">
                                      Please Enter No. Of Days
                                    </span>
                                  </span>
                                </div>         
                              </div>

                            <div class="my-2 col-lg-2 col-md-3 col-3 role-input">
                              <label for="forRoleNameSection" class="form-label main-heading">Shift Worked</label><span> *</span>
                              <select class="form-select employee-detail" formControlName="ShiftTypeId" (change)="onShiftChange($event)">

                              </select>
                              <div class="validation-message-container">
                                <span *ngIf="(addAllowanceForm.controls['ShiftTypeId'].invalid && (addAllowanceForm.controls['ShiftTypeId'].dirty || addAllowanceForm.controls['ShiftTypeId'].touched))">

                                    Please Select Shift Worked
                                  </span>
                                </span>
                              </div>
                          </div>
