<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div class="col-md-4">
        <a href="ray-main">
          <h1 class="headv" style="font-family:Barlow,sans-serif">Refer Another You</h1>
        </a>
      </div>
      <div class=" col-md-8 d-flex align-items-center">
        <h3 class="header-text">
          You know us best. You know what works. You fit in.
          Help us find another you.
        </h3>
      </div>
    </div>
    <div class="row d-flex justify-content-between" style="padding-bottom: 20px;">
      <div class="col-md-6 mb-2 serach">
        <input type="text" class="form-control" placeholder="Search" [(ngModel)]="titleFilter" style="border: 2px solid #0BAB8E; height: 32px; width:250px; border-radius: 2px;">
      </div>
      <div class="col-md-6 filte" style="padding-right: 30px;">
        <div class="custom-select">
          <div class="dropdown-icon start-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="22" fill="currentColor" class="bi bi-funnel" viewBox="0 0 16 16">
              <path d="M1.5 1.5A.5.5 0 0 1 2 1h12a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.128.334L10 8.692V13.5a.5.5 0 0 1-.342.474l-3 1A.5.5 0 0 1 6 14.5V8.692L1.628 3.834A.5.5 0 0 1 1.5 3.5zm1 .5v1.308l4.372 4.858A.5.5 0 0 1 7 8.5v5.306l2-.666V8.5a.5.5 0 0 1 .128-.334L13.5 3.308V2z"/>
            </svg>
          </div>
          <select id="locationFilter" [(ngModel)]="selectedLocation" (change)="getFilteredJobs()">
            <option value="">All Locations</option>
            <option *ngFor="let location of locations" [value]="location">{{ location }}</option>
          </select>
          <div class="dropdown-icon end-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-down" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708"/>
            </svg>
          </div>
        </div>
      </div>
    </div>  
    <div class="row margi">   
      <div class="col-md-12" style="text-align: end;">
        <span style="font-size: 16px;font-style: italic;font-weight: 100;">
          To view details about referral policies, please
          <button class="btn btn-link" (click)="openPopup()" style="color: #0BAB8E; font-size: 16px; vertical-align: baseline;">click here</button>
        </span>
      </div>
      
    </div>
    <div class="row" style="padding-top:10px;">
      <ng-container *ngFor="let job of getFilteredJobs()">
          <div class="col-md-3 mb-3">
              <div class="card h-100 d-flex flex-column">
                  <div class="card-body flex-grow-1">
                      <h5 class="card-title">{{ job.title }}</h5>
                      <p class="card-text">{{ job.location.name }}</p>
                  </div>
                  <div class="card-footer mt-auto d-flex justify-content-between">
                      <button class="btn btn-primary flex-fill mr-1" (click)="showMoreDetails(job.id)">More Details</button>
                      <a href="https://emids.greenhouse.io/dashboard" target="_blank" class="btn btn-primary flex-fill ml-2">Refer</a>
                  </div>
              </div>
          </div>
      </ng-container>
  </div>
    <div id="scrollTopButton" class="scroll-top" (click)="scrollToTop()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-up" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M7.646 4.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1-.708.708L8 5.707l-5.646 5.647a.5.5 0 0 1-.708-.708z"/>
      </svg>
  </div>
  </div>
  <div *ngIf="selectedJob">
    <app-more-details [job]="selectedJob"></app-more-details>
  </div>
