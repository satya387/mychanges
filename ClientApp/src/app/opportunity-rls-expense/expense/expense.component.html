<div class="expense-section">
    <div class="expense-header">
        <h2>Expenses</h2>
        <span class="add-expense" [hidden]="!isEditable" (click)="isEditable && openExpensePopup()"
        title="Add Expense">
            <svg width="22px" height="25px" viewBox="0 0 24.00 24.00" fill="none" xmlns="http://www.w3.org/2000/svg"
                stroke="#ffffff" transform="rotate(0)" stroke-width="1.56">
                <g id="SVGRepo_bgCarrier" stroke-width="0" />
                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round" stroke="#CCCCCC"
                    stroke-width="0.096" />
                <g id="SVGRepo_iconCarrier">
                    <path opacity="0.5"
                        d="M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z"
                        fill="#0d0357" />
                    <path
                        d="M12.75 9C12.75 8.58579 12.4142 8.25 12 8.25C11.5858 8.25 11.25 8.58579 11.25 9L11.25 11.25H9C8.58579 11.25 8.25 11.5858 8.25 12C8.25 12.4142 8.58579 12.75 9 12.75H11.25V15C11.25 15.4142 11.5858 15.75 12 15.75C12.4142 15.75 12.75 15.4142 12.75 15L12.75 12.75H15C15.4142 12.75 15.75 12.4142 15.75 12C15.75 11.5858 15.4142 11.25 15 11.25H12.75V9Z"
                        fill="#0d0357" />
                </g>
            </svg>
        </span>
    </div>

    <div class="expense-container" *ngIf="showExpenseData">
        <div *ngFor="let expense of expenseData?.rLSExpenses" class="expense">
            <div class="expense-content">
                <h3 class="expense-heading"> {{ expense.expenseCategory }}</h3>
                <p>
                    <b>Amount :</b> &nbsp;
                    &#36;{{ expense.expenseAmount | number:'1.0-0' }}
                </p>
                <p>
                    <b>Bill Type :</b> &nbsp;
                    {{ expense.billType === 1 ? 'Billable' : 'Non Billable' }}
                </p>
                <p>
                    <b>Location :</b> &nbsp;
                    {{ expense.location }}
                </p>

            </div>
            <div class="expense-footer">
                <span [ngClass]="isEditable? 'edit-expense' : 'edit-expense'"
                    (click)="openExpensePopup(expense)" title="Edit Expense">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-pencil" viewBox="0 0 16 16">
                        <path
                            d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325" />
                    </svg>
                </span>
                <span class="delete-expense" [hidden]="!isEditable"
                    (click)="isEditable && deleteExpense(expense); $event.stopPropagation()" title="Delete Expense">
                    <svg width="16px" height="16px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                        <g id="SVGRepo_bgCarrier" stroke-width="0" />

                        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round" />

                        <g id="SVGRepo_iconCarrier">
                            <path d="M10 12V17" stroke="#BC194D" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M14 12V17" stroke="#BC194D" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M4 7H20" stroke="#BC194D" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M6 10V18C6 19.6569 7.34315 21 9 21H15C16.6569 21 18 19.6569 18 18V10"
                                stroke="#BC194D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M9 5C9 3.89543 9.89543 3 11 3H13C14.1046 3 15 3.89543 15 5V7H9V5Z" stroke="#BC194D"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </g>

                    </svg>
                </span>
            </div>
        </div>
    </div>

    <div *ngIf="!showExpenseData">
        <p style="padding: 15px;">No data to display</p>
      </div>
</div>

<div class="modal" id="confirmDeleteModal" [hidden]="!showDeleteConfirm">
    <div class="modal-content">
        <h3>Confirm Delete</h3>
        <p>Are you sure you want to delete this Expense?</p>
        <div class="modal-actions">
            <button class="btn confirm-btn" (click)="confirmDelete()">Confirm</button>
            <button class="btn cancel-btn" (click)="cancelDelete()">Cancel</button>
        </div>
    </div>
</div>
