<div class="popup-container">

  <div class="header">
    <h6 class="upload-text" id="Title">Plan vs Actual</h6>
    <button class="cancel-button" (click)="onCloseClick()">&#10005;</button>
  </div>

  <div class="filter-row">

    <div class="filter-item">
      <label for="yearDropdown" class="filter-label">Select Year:</label>
      <select id="yearDropdown" class="filter-dropdown" [(ngModel)]="selectedYear" (change)="onYearChange($event)">
        <option *ngFor="let year of years" [value]="year">{{ year }}</option>
      </select>
    </div>

    <div class="filter-item">
      <label for="monthDropdown" class="filter-label">Select Month:</label>
      <select id="monthDropdown" class="filter-dropdown" [(ngModel)]="selectedMonth" (change)="onMonthChange($event)">
        <option *ngFor="let month of months" [value]="month.value">{{ month.name }}</option>
      </select>
    </div>
