<div class="container table-responsive mt-3">
  <div class="functionality-wrap adding-margin-to-table">
    <ul class="mb-0">
      <li>
        <!-- <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-people-fill"
          viewBox="0 0 16 16">
          <path d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1H7zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
          <path fill-rule="evenodd"
            d="M5.216 14A2.238 2.238 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.325 6.325 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1h4.216z" />
          <path d="M4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z" />
        </svg> -->
        <i class="ri-group-fill"></i>
      </li>
      <li>
        <strong>Users</strong>
      </li>

    </ul>
  </div>
  <p class="total-roles">Total Users ({{totalRecord}})</p>
  <div class="table-responsive">
    <table class="table" id="users-table">
      <thead>
        <tr style="background-color: #F8F9FA;">
          <th  class="search-bar">
            Users
          </th>
          <th  class="search-bar">Roles</th>
          <th  class="search-bar">Sections</th>
          <th  class="search-bar">Created Date</th>
          <th style="width: 17%; " class="search-bar">Created By</th>
          <th class="action-field">Action</th>
        </tr>
        <tr class="search-row-th">
          <!-- user search -->
          <th>
            <div class="general-search">
              <div class="row height">
                <div class="col-lg-10">
                  <div class="form-search">
                    <input type="text" class="form-control form-input" id="inp" [(ngModel)]="userName" placeholder="User Name"
                      (keydown.enter)="configureRequest('name', undefined, userName)">
                    <span> <div class="positon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-search " viewBox="0 0 16 16"
                        (click)="configureRequest('name', undefined, userName)">
                        <path
                          d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />
                      </svg></div> </span>
                  </div>
                </div>
              </div>
            </div>
          </th>
          <!-- roles search -->
          <th>
            <div class="general-search">
              <div class="row height">
                <div class="col-lg-10">
                  <div class="form-search">
                    <input type="text" class="form-control form-input" [(ngModel)]="roleSearch" placeholder="Role Name"
                      (keydown.enter)="configureRequest('roles', undefined, roleSearch)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                      class="bi bi-search" viewBox="0 0 16 16"
                      (click)="configureRequest('roles', undefined, roleSearch)">
                      <path
                        d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />
                    </svg>
                  </div>
                </div>
              </div>
            </div>
          </th>
          <th>

          </th>
          <!-- Created Date -->
          <th>
            <div class="general-search">
              <div class="row height">
                <div class="col-lg-10">
                  <div class="form-search">
                    <input type="text" class="form-control form-input" id="inp1" [(ngModel)]="publishedDate"
                      placeholder="MM/DD/YYYY"
                      (keydown.enter)="configureRequest('createdDate', undefined, publishedDate)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                      class="bi bi-search" viewBox="0 0 16 16"
                      (click)="configureRequest('createdDate', undefined, publishedDate)">
                      <path
                        d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />
                    </svg>
                  </div>
                </div>
              </div>
            </div>
          </th>
          <!-- Created By -->
          <th>
            <div class="general-search">
              <div class="row height">
                <div class="col-lg-10">
                  <div class="form-search">
                    <input type="text" class="form-control form-input"[(ngModel)]="publishedBy"
                      placeholder="Created By" (keydown.enter)="configureRequest('createdBy', undefined, publishedBy)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                      class="bi bi-search" viewBox="0 0 16 16"
                      (click)="configureRequest('createdBy', undefined, publishedBy)">
                      <path
                        d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />
                    </svg>
                  </div>
                </div>
              </div>
            </div>
          </th>
          <th></th>
        </tr>
      </thead>

      <!-- ############################  body of table is start here ###########################################-->
      <tbody>

        <tr *ngFor="let list of userList  | paginate  : {
        itemsPerPage: limit,
        currentPage: page,
        totalItems: totalRecord };  let i = index">
          <td>{{list.name}}</td>
          <td class="asign-sec"> <a (click)="redirectToUserRole(list, 'role')">{{list.roles || 'Map Roles'}} </a> </td>
          <td class="asign-sec"> <a (click)="redirectToUserRole(list, 'section')"> {{list.sections || 'Map Sections'}}
            </a></td>
          <td>{{list.createdDate ? (list.createdDate | date: 'MM/dd/yyyy') : '-'}}</td>
          <td>{{list.createdBy || '-'}}</td>
          <td class="edit-delete">
            <a (click)="redirectToUserRole(list, false)" class="edit" title="Edit" data-toggle="tooltip"><svg
                xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-pencil-fill"
                viewBox="0 0 16 16">
                <path
                  d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708l-3-3zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207l6.5-6.5zm-7.468 7.468A.5.5 0 0 1 6 13.5V13h-.5a.5.5 0 0 1-.5-.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.499.499 0 0 1-.175-.032l-.179.178a.5.5 0 0 0-.11.168l-2 5a.5.5 0 0 0 .65.65l5-2a.5.5 0 0 0 .168-.11l.178-.178z" />
              </svg></a>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="container" style="background-color: #F8F9FA;">
      <span *ngIf="userList?.length === 0">
        <p class="text-center no-data">
          No Data Found!
        </p>
      </span>
    </div>
  </div>
  <!-- ##################  pagination section start here #################### -->

  <div class="clearfix pagination-wrap">
    <pagination-controls previousLabel="" nextLabel="" (pageChange)="onTableDataChange($event)">
    </pagination-controls>
  </div>

  <!-- #######################  pagination section end here ##################### -->
</div>
