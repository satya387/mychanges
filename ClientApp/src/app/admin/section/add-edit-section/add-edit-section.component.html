<div class="container">
  <div class="add-edit-role-wrap adding-margin-to-table">
    <app-back-button [routerPath]="'/section'"></app-back-button>

    <div class="add-edit-head">
      <h1><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-stack"
          viewBox="0 0 16 16">
          <path
            d="m14.12 10.163 1.715.858c.22.11.22.424 0 .534L8.267 15.34a.598.598 0 0 1-.534 0L.165 11.555a.299.299 0 0 1 0-.534l1.716-.858 5.317 2.659c.505.252 1.1.252 1.604 0l5.317-2.66zM7.733.063a.598.598 0 0 1 .534 0l7.568 3.784a.3.3 0 0 1 0 .535L8.267 8.165a.598.598 0 0 1-.534 0L.165 4.382a.299.299 0 0 1 0-.535L7.733.063z" />
          <path
            d="m14.12 6.576 1.715.858c.22.11.22.424 0 .534l-7.568 3.784a.598.598 0 0 1-.534 0L.165 7.968a.299.299 0 0 1 0-.534l1.716-.858 5.317 2.659c.505.252 1.1.252 1.604 0l5.317-2.659z" />
        </svg>
        {{sectionAction}} Section</h1>
    </div>
    <form class="common-form-field-box" [formGroup]="addSectionForm" novalidate>
      <div class="mt-4 col-lg-6 col-md-12 role-input">
        <label for="forRoleName" class="form-label">Section Name</label> <span> *</span>
        <input type="text" class="form-control" id="forContentName" placeholder="Enter Section Name" required
          formControlName="sectionName" [minlength]="minLength">
        <!-- <div>
          <button class="upload-files" onclick="document.getElementById('getIcon').click()">Upload from Files</button>
          <input type='file' id="getIcon" style="display:none" (change)="onSelectIconFile($event)" alt=""
            onclick="this.value=null;" title="pload from Files">
        </div> -->
        <span
          *ngIf="(addSectionForm.controls['sectionName'].invalid && (addSectionForm.controls['sectionName'].dirty || addSectionForm.controls['sectionName'].touched))">
          <span *ngIf="addSectionForm.controls['sectionName'].errors.required"> Please enter section name </span>
          <span *ngIf="addSectionForm.controls['sectionName'].errors?.minlength"> Section name must be at least
            {{minLength}} characters long </span>
          <span *ngIf="addSectionForm.controls['sectionName'].errors?.maxlength"> Section name cannot exceed
            {{maxLength}} characters </span>
        </span>
      </div>

      <app-image-upload [label]="''" [addIcon]="true" (onSelectImage)="getSelectedImage($event)"
        [sectionImage]="imageUrl" [sectionIconImg]="sectionData?.iconUrl" (downloadImage)="downloadSectionIcon()">
      </app-image-upload>

      <app-image-upload [label]="'Section'" [addIcon]="false" (onSelectImage)="getSelectedImage($event)"
        [sectionImage]="sectionData?.imageUrl" (downloadImage)="downloadSectionImage()">
      </app-image-upload>

      <!-------------------------- section-type for url ----------------------------->
      <div class="mt-4 col-lg-6 col-md-12 role-input">

        <div class="row my-0 my-md-2">
          <div class=" col-md-6 role-input ">

            <!-- <label for="forRoleName" class="form-label">Section type</label> -->

            <div class="check-fill d-flex">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="flexRadioDefault" id="flexRadioDefault1"
                  [checked]="isResourceSelected" (change)="onSelectURL($event)" />
                <label class="form-check-label" for="flexRadioDefault1">
                  Section Resource URL
                </label>
              </div>
            </div>
          </div>
        </div>
        <div class="role-input" *ngIf="isResourceSelected">
          <label for="forRoleName" class="form-label">Resource URL</label> <span> *</span>
          <input type="text" class="form-control" id="forContentName" formControlName="sectionResourceURL"
            [pattern]="urlPattern" placeholder="Resource URL">
          <span
            *ngIf="(addSectionForm.controls['sectionResourceURL'].invalid && (addSectionForm.controls['sectionResourceURL'].dirty || addSectionForm.controls['sectionResourceURL'].touched))">
            <span *ngIf="addSectionForm.controls['sectionResourceURL'].errors.required"> Please enter section resource
              URL
            </span>
            <span *ngIf="addSectionForm.controls['sectionResourceURL'].errors.pattern">
              Please enter valid URL </span>
          </span>
        </div>
      </div>
    </form>
  </div>
  <div class="big-button-bottom">
    <ul>
      <li><button (click)="createSection()" [disabled]="!addSectionForm.valid">SAVE</button></li>
      <li><button [routerLink]="'/section'">CANCEL</button></li>
    </ul>
  </div>
</div>
