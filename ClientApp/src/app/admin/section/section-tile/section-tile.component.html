<div class="container  mt-3">
  <div class="add-edit-role-wrap adding-margin-to-table">
    <!-- <div class="back-btn">
            <a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
	        <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
	        </svg>Back</a>
        </div> -->
    <app-back-button [routerPath]="'/section'"></app-back-button>

    <div class="add-edit-head">
      <h1><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-stack"
          viewBox="0 0 16 16">
          <path
            d="m14.12 10.163 1.715.858c.22.11.22.424 0 .534L8.267 15.34a.598.598 0 0 1-.534 0L.165 11.555a.299.299 0 0 1 0-.534l1.716-.858 5.317 2.659c.505.252 1.1.252 1.604 0l5.317-2.66zM7.733.063a.598.598 0 0 1 .534 0l7.568 3.784a.3.3 0 0 1 0 .535L8.267 8.165a.598.598 0 0 1-.534 0L.165 4.382a.299.299 0 0 1 0-.535L7.733.063z" />
          <path
            d="m14.12 6.576 1.715.858c.22.11.22.424 0 .534l-7.568 3.784a.598.598 0 0 1-.534 0L.165 7.968a.299.299 0 0 1 0-.534l1.716-.858 5.317 2.659c.505.252 1.1.252 1.604 0l5.317-2.659z" />
        </svg>Section Tiles</h1>
    </div>

    <div class="my-4 col-lg-4 col-md-12 role-input">
      <input type="text" class="form-control" required id="forSectionName" readonly [value]="sectionName">
      <!-- <select class="form-select">
        <option selected>{{sectionName}}</option>
      </select> -->
    </div>

    <div class="add-section-wrap p-2 p-md-4 ScrollStyle">
      <div class="inner-wrap-pad p-0 p-md-4">
        <app-assign-control [autoCompleteList]="tilesList" [labelName]="'Tiles'" [selectedList]="selectedTilesList"
          [placeholderText]="tilesPlaceHolderText" (onSelectData)="onSelectItem($event)"></app-assign-control>
        <div class="big-button-bottom">
          <ul>
            <li><button [disabled]="!isTileSelected && selectedTilesList.length === 0" (click)="mapTilesToSection()">SAVE</button></li>
            <li><button [routerLink]="'/section'">CANCEL</button></li>
          </ul>
        </div>

      </div>
    </div>

  </div>

</div>
