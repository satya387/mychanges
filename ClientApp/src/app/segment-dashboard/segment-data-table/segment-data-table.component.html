    <p-treeTable [value]="treeData" [columns]="pivotColumns" tableStyleClass="p-datatable-sm">
      <!-- Hierarchical Row Template -->
      <ng-template *ngIf="buGroups; else noBuGroups" pTemplate="header" let-columns>
        <tr>
          <th rowspan="3">Category</th>
          <th rowspan="3">Customer</th>
          <th rowspan="3">Project Name</th>
    
          <ng-container *ngFor="let bu of buGroups">
            <th [attr.colspan]="getBUColSpan(bu)">{{ bu.name }}</th>
          </ng-container>
    
          <th rowspan="3">Org Total</th>
        </tr>
    
        <!-- Segment Headers -->
        <!-- <tr>
          <ng-container *ngFor="let segment of buSegments">
            <th [attr.colspan]="getSegmentColSpan(segment)">{{ segment.name }}</th>
          </ng-container>
        </tr> -->
    
        <!-- Quarter Headers -->
        <tr>
          <ng-container *ngFor="let col of pivotColumns">
            <th>{{ col.header }}</th>
          </ng-container>
        </tr>
      </ng-template>
      <ng-template #noBuGroups>
        <tr>
          <th rowspan="3">Category</th>
          <th rowspan="3">Customer</th>
          <th rowspan="3">Project Name</th>
          <th rowspan="3">Org Total</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-rowNode let-columns="columns">
        <!-- <pre>{{ rowNode | json }}</pre> -->
        <!-- <pre>{{ rowNode.node | json }}</pre> -->
        <tr>
          <td>
            <p-treeTableToggler [rowNode]="rowNode"></p-treeTableToggler>
            {{ getCategory(rowNode) }}
          </td>
          <td>
            {{ getCustomer(rowNode)  }}
          </td>
          <td>
            {{ getProject(rowNode) }}
          </td>
        
          <ng-container *ngFor="let col of columns">
            <td>{{ getBUValue(rowNode, col.field) }}</td>
          </ng-container>
        
          <td>{{ getOrgTotal(rowNode) }}</td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" style="text-align: center; color: #888;">
            No data to display
          </td>
        </tr>
      </ng-template>
    </p-treeTable>
