<div class="container adding-margin-to-table mt-3-view">
  <div class="add-edit-tile-wrap">
    <!-- <app-back-button [routerPath]="'home'"></app-back-button> -->
    <div class="back-btn">
      <a href=""><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
          class="bi bi-arrow-left" viewBox="0 0 16 16">
          <path fill-rule="evenodd"
            d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z" />
        </svg>BACK</a>
    </div>

    <div class="add-edit-head">
      <h1 class="functionality-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
          class="bi bi-stack" viewBox="0 0 16 16">
          <path
            d="m14.12 10.163 1.715.858c.22.11.22.424 0 .534L8.267 15.34a.598.598 0 0 1-.534 0L.165 11.555a.299.299 0 0 1 0-.534l1.716-.858 5.317 2.659c.505.252 1.1.252 1.604 0l5.317-2.66zM7.733.063a.598.598 0 0 1 .534 0l7.568 3.784a.3.3 0 0 1 0 .535L8.267 8.165a.598.598 0 0 1-.534 0L.165 4.382a.299.299 0 0 1 0-.535L7.733.063z" />
          <path
            d="m14.12 6.576 1.715.858c.22.11.22.424 0 .534l-7.568 3.784a.598.598 0 0 1-.534 0L.165 7.968a.299.299 0 0 1 0-.534l1.716-.858 5.317 2.659c.505.252 1.1.252 1.604 0l5.317-2.659z" />
        </svg>{{tileDetail?.sectionName}}</h1>
      </div>
      <div class="row modified-save-close-btn1" *ngIf="tileDetail.isTilesPersonalised">
        <ul>
          <li><button (click)="savePersonalizedTiles(tileDetail)">SAVE</button></li>
          <li><button [routerLink]="'/'">CANCEL</button></li>
        </ul>
      </div>
    <div class="tile-blue-bg-details">
      <div class="container">
        <div class="col-12">
          <div class="row tile-border-wrap">
            <!-- {{tileDetail.tilesList}} -->

            <div class="col-6 col-xxl-2 col-xl-2 col-lg-3 col-md-3 d-flex p-1  "
              *ngFor="let item of tileDetail?.tilesList;  let i=index">

              <div class="col-12 tile-border tile-border-edit-mode m-0">
                <div class="personalize-tile" *ngIf="tileDetail.isTilesPersonalised">
                  <div class="personalize-active-and-order" *ngIf="tileDetail.isTilesPersonalised">
                    <ul>
                      <li *ngIf="item.isActive" class="activeswitch">Active</li>
                      <li *ngIf="!item.isActive" class="inactiveswitch">Inactive</li>
                      <li class="status-toggle">
                        <label class="switch">
                          <input type="checkbox" checked [(ngModel)]="item.isActive" />
                          <span class="swtch-toggle round" (click)="statusToggleTile(item)"></span>
                        </label>
                      </li>
                    </ul>
                  </div>
                  <div class="personalize-active-and-order">
                    <select (change)="updateTileDisplayOrder($event, item)" [(ngModel)]="item.displayOrder">
                      <option *ngFor="let order of tileDetail?.tilesList; let in = index">
                        {{ in + 1 }}
                      </option>
                    </select>
                  </div>
                </div>
                <div class="col-12 inside-tile-imgs text-center">
                  <a class="inside-tile1" [href]="item.tileLink" target="_blank">
                    <img [src]="item.iconUrl" />
                    <p>{{item.name}}</p>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
