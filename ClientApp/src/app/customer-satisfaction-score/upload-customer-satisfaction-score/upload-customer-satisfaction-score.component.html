<div class="popup-container">
  <div class="header">
    <h6 class="upload-text" id="Title">Upload</h6>
    <button class="cancel-button" (click)="onCloseClick()">&#10005;</button>
  </div>

  <div class="popup">
    <form [formGroup]="uploadCSATForm" style="margin-left: 31px; margin-right: 20px;">
      <div class="container-fluid" style="margin-top: 24px; margin-bottom: 54px;">
        <div class="row">
          <div>
            <div class="form-group">
              <label for="exampleFormControlSelect1" class="required">Cycle <span class="text-danger">*</span></label>
              <select class="form-select project-detail" formControlName="cycleName" (change)="onSelect($event)">
                <option [ngValue]="null" selected>Select</option>
                <option *ngFor="let item of cycleData" [value]="item.cycleName">{{ item.cycleName }}</option>
              </select>
              <!-- Validation error message -->
              <span *ngIf="uploadCSATForm.controls['cycleName'].invalid && 
              (uploadCSATForm.controls['cycleName'].dirty || 
              uploadCSATForm.controls['cycleName'].touched || 
              formSubmitted)">
                <span class="text-danger">Please Select Cycle</span>
              </span>
              <br />
            </div>
          </div>
          <div>
            <div class="form-group">
              <label>Upload File <span class="text-danger">*</span></label>
              <input type="file" class="form-control" (change)="uploadedFile($event)" placeholder="Upload file"
              formControlName="uploadFileName" accept=".xlsx">
              <!-- Validation error message for file upload -->
              <span *ngIf="(!fileUploaded && formSubmitted) || (fileUploaded && !isValidFileType())" 
              class="text-danger">
                Please upload a valid .xlsx file.
              </span>
            </div>
          </div>
          <br />
        </div>
        <button type="submit" class="btn btn-primary" (click)="onUpload()" 
        style="margin-top: 17px; margin-left: 12px; background-color: #0D0357; width: 250px;">Submit</button>
        <div *ngIf="validationErrorMessages.length > 0" class="alert alert-danger alert-dismissible fade show" role="alert" style="margin-top: 20px; max-height: 200px; overflow-y: auto;">
          <ul>
            <li *ngFor="let errorMessage of validationErrorMessages">{{ errorMessage }}</li>
          </ul>
          <button type="button" class="btn-close" aria-label="Close" (click)="closeAlert()"></button>
        </div>
      </div>
    </form>
  </div>
</div>
