<!-- Modal and overlay container with ngIf directive -->
<div class="modal-container" *ngIf="modalOpened">
    <div class="modal-body">
        <form>
            <p>Are you sure, you want to reject <b>{{ message }} </b> ? </p>
            <div class="form-group role-input1">
                <!-- <label for="firstName">Comments:</label> <span> *</span> -->

                <textarea id="Comments" name="Comments" rows="2" cols="36" [(ngModel)]="formData.Comments"
                    placeholder="Enter Comments">
                            </textarea>
                <span [hidden]='!isValid'> Please Enter Comments</span>
            </div>
        </form>
        <div class="big-button-bottom">
            <ul class="text-center" style="margin:5px;">
                <li> <button type="button" (click)="onSave()">{{ btnOkText }}</button></li>
                <li><button type="button" (click)="onCancel()">{{ btnCancelText }}</button></li>
            </ul>
        </div>
    </div>
    <!-- Overlay to create the masking effect -->
    <div class="modal-overlay"></div>
</div>
