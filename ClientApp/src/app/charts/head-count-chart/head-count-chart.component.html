<div class="container">
  <div class="content" *ngIf="options && selectedOptionLocation == 1">
    <b class="heading" style="font-size: x-large;">FTE movement - On Shore</b>
    <img src="../../../assets/images/tooltip.png" alt="Tooltip Icon" class="tooltipImage" title="List of Billable, Non-Billable & Un-Billable resources at USA & Canada location.">
    <ag-charts-angular id="bar-chart" style="height: 100%" [options]="options"></ag-charts-angular>
  </div>

  <div class="content" *ngIf="options && selectedOptionLocation == 2">
    <b class="heading" style="font-size: x-large;">FTE movement - Off Shore</b>
    <img src="../../../assets/images/tooltip.png" alt="Tooltip Icon" class="tooltipImage" title="List of Billable, Non-Billable & Un-Billable resources at India & Philippines location.">
    <ag-charts-angular id="bar-chart" style="height: 100%" [options]="options"></ag-charts-angular>
  </div>

  <div class="content" *ngIf="options && selectedOptionLocation == 3">
    <b class="heading" style="font-size: x-large;">FTE movement - Near Shore</b>
    <img src="../../../assets/images/tooltip.png" alt="Tooltip Icon" class="tooltipImage" title="List of Billable, Non-Billable & Un-Billable resources at Armenia, Argentina, Mexico & Romania location.">
    <ag-charts-angular id="bar-chart" style="height: 100%" [options]="options"></ag-charts-angular>
  </div>
</div>
