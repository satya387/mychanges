<div class="container">
  <div class="content" *ngIf="optionsDollar && selectedOption === 1">

    <b style="font-size: x-large;">EBITDA $</b>
    <img src="../../../assets/images/tooltip.png" alt="Tooltip Icon" class="tooltipImage" title="EBITDA = (Revenue – Payroll – Project Expenses - DSC - BuCost - SGA)">

      <label class="switch bookmark-label" style="width: 50px;text-align-last: right;display: inline;">
        <input type="checkbox" [formControl]="Addbackcontrol" style="width: 50px;" (change)="onCheckboxChange($event)" [checked]="Addbackcontrol.value">
        <span class="swtch-toggle round" style="width: 40px;margin-left: 400px;" ></span>
        <span class="bookmark-label-text" style="margin-left: 410px;">With Addback</span>
      </label>
    <div class="ebitda-container">
      <div class="chart-and-buttons">
        <ag-charts-angular id="ebitda-chart" [options]="optionsDollar"></ag-charts-angular>
      </div>
   </div>
  </div>

  <div class="content" *ngIf="optionsPercentage && selectedOption === 2">

    <b style="font-size: x-large;">EBITDA %</b>
    <img src="../../../assets/images/tooltip.png" alt="Tooltip Icon" class="tooltipImage" title="EBITDA = (Revenue – Payroll – Project Expenses - DSC - BuCost - SGA)">
    
    <div class="ebitda-container">
      <div class="chart-and-buttons">
        <ag-charts-angular id="ebitda-chart" [options]="optionsPercentage"></ag-charts-angular>
      </div>
   </div>
  </div>
</div>
