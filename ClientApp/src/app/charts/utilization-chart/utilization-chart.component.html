<div class="container">
  <div class="content" *ngIf="options && selectedOptionLocation == 1">
    <b style="font-size: x-large;">Utilization - On Shore</b>
    <img src="../../../assets/images/tooltip.png" alt="Tooltip Icon" class="tooltipImage" title="Organization Utilization = Billable / (Billable + Non-Billable). Non-Billable includes project Non-Billable, Ramp Up, Launchpad & Organization Delivery.">
    <div class="utilization-chart">
      <ag-charts-angular id="utilization-chart" style="height: 100%" [options]="options"></ag-charts-angular>
    </div>
  </div>
  <div class="content" *ngIf="options && selectedOptionLocation == 2">
    <b style="font-size: x-large;">Utilization - Off Shore</b>
    <img src="../../../assets/images/tooltip.png" alt="Tooltip Icon" class="tooltipImage" title="Organization Utilization = Billable / (Billable + Non-Billable). Non-Billable includes project Non-Billable, Ramp Up, Launchpad & Organization Delivery.">
    <div class="utilization-chart">
      <ag-charts-angular id="utilization-chart" style="height: 100%" [options]="options"></ag-charts-angular>
    </div>
  </div>
  <div class="content" *ngIf="options && selectedOptionLocation == 3">
    <b style="font-size: x-large;">Utilization - Near Shore</b>
    <img src="../../../assets/images/tooltip.png" alt="Tooltip Icon" class="tooltipImage" title="Organization Utilization = Billable / (Billable + Non-Billable). Non-Billable includes project Non-Billable, Ramp Up, Launchpad & Organization Delivery.">
    <div class="utilization-chart">
      <ag-charts-angular id="utilization-chart" style="height: 100%" [options]="options"></ag-charts-angular>
    </div>
  </div>
</div>
